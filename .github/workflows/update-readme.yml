name: Daily Profile README Update

on:
  schedule:
    # Runs every day at 02:30 UTC (08:00 IST)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-profile:
    name: Fetch Stats & Update Portfolio README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run profile statistics and SVG generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python -m scripts.main

      - name: Commit and push updated profile if changed
        run: |
          if [[ -z "$(git status --porcelain README.md assets/svg data/stats_snapshot.json)" ]]; then
            echo "No changes detected in generated profile artifacts. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/svg data/stats_snapshot.json
          git commit -m "chore(profile): daily stats and portfolio SVG sync"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
